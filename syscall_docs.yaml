---
general_info: >
  In the system call descriptions, "undefined behavior" means anything can
  happen, including an abort of the contract invocation.

syscall_descriptions:
  - name: "SHA256Update"
    descr: >
      Append the data in `buffer` to the digest input.  If `reset` is true,
      first reset the digest state to its initial condition.

      Calling this function with `reset = true` and buffer `B` yields the same
      system state as calling it once with `reset = true` and an empty buffer,
      and then again with `reset = false` and buffer `B`.

      Calling `SHA256` (the one-shot interface) leaves the incremental digest
      state in an undefined condition; `SHA256Update` with `reset = true` must
      be called before further calls to `SHA256Update` with `reset = false` or
      to `SHA256Finalize`, or else undefined behavior will occur.

  - name: "SHA256Finalize"
    descr: >
      Output the final SHA256 digest.

      After this function returns, calling `SHA256Finalize` again or
      `SHA256Update` with `reset = false` yields undefined behavior.
