name: C++ CI

on:
  push:
    branches: [ "main" ]  
  pull_request:
    branches: [ "main" ]

# pull-requests: write lets the advisory XDR check post its report as a
# comment on the pull request under review.
permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v6
      with:
        # xdrcompat compares the PR merge-base (or the pre-push commit) with
        # the exact head revision, so both sides must be available locally.
        fetch-depth: 0
    - name: gcc version check
      run: gcc --version
    - name: clang version check
      run: clang --version
    - name: install emacs
      run: sudo apt-get install emacs
    - name: check format
      run: ./scripts/xdrformat -c
    - name: check XDR evolution rules (advisory)
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PUSH_BEFORE_SHA: ${{ github.event.before }}
        PUSH_HEAD_SHA: ${{ github.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        # A fork pull request gets a read-only token, so leave GH_TOKEN unset
        # there: the wrapper then skips the comment instead of failing to post
        # one. Same-repository pull requests are the case that must report.
        GH_TOKEN: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.token || '' }}
      run: |
        if [[ "$EVENT_NAME" == "pull_request" ]]; then
          base="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
          head="$PR_HEAD_SHA"
        else
          base="$PUSH_BEFORE_SHA"
          head="$PUSH_HEAD_SHA"
          if [[ "$base" =~ ^0+$ ]]; then
            # An initial branch push has no predecessor. Compare the full tree
            # against Git's empty tree, not merely the final commit's parent.
            base="$(git hash-object -t tree /dev/null)"
          fi
        fi
        scripts/xdrcompat/ci-wrapper.sh . "$base" "$head"
    # Must run before the root `go mod init temp_module` below, and is what
    # keeps the checker's own reporting and rule coverage honest.
    - name: test XDR evolution rule checker
      working-directory: scripts/xdrcompat
      run: |
        go vet ./...
        go test ./...
    - name: install yamllint
      run: sudo apt-get install yamllint
    - name: install goxdr
      run: go install github.com/xdrpp/goxdr/cmd/goxdr@latest
    - name: check go generate
      # goxdr emits one Go package, so a parallel variant that redeclares names
      # from the file it supersedes (repair2.x, discovery2.x, multiplex2.x)
      # stays out of it; xdrcompat leaves out the same two new files.
      run: |
        shopt -s extglob
        $HOME/go/bin/goxdr -o generated.go !(transaction_trace|ffi_enums|storage_lock|executor_to_db_rpc|invoke_flag|contract_spec|view|view_gateway|invoke_args|repair2|discovery2|multiplex2).x
    - name: check go build
      # go vet has warnings on the goxdr/xdr package,
      # so we set -composites=false to ignore those errors
      run: |
        go mod init temp_module
        go mod tidy
        go vet -composites=false generated.go
    - name: lint yaml
      run: yamllint -s syscalls.yaml
