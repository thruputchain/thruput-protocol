---
# Syscalls MUST be defined in increasing numerical order (by the 'number' field)
syscall_input_count: 7
type_mappings:
  - base_name: "uint32_t"  # The cpp name, which is used in this spec
    rust_name: "u32"
    rust_uses_as_ptr: false
    primitive_type: true
  - base_name: "int32_t"
    rust_name: "i32"
    rust_uses_as_ptr: false
    primitive_type: true
  - base_name: "uint64_t"
    rust_name: "u64"
    rust_uses_as_ptr: false
    primitive_type: true
  - base_name: "int64_t"
    rust_name: "i64"
    rust_uses_as_ptr: false
    primitive_type: true
  - base_name: "int128_t"
    rust_name: "i128"
    rust_uses_as_ptr: false
  - base_name: "uint128_t"
    rust_name: "u128"
    rust_uses_as_ptr: false
  - base_name: "bool"
    rust_name: "bool"
    rust_uses_as_ptr: false
  - base_name: "generated::AuthClaim"
    rust_name: "AuthClaim"
    rust_uses_as_ptr: false
syscalls:
  - name: "SHA256"
    read_only: true
    inputs:
      - name: "buffer"
        span_argument: true
    outputs:
      - name: "hash"
        typename: "SHA256Hash"
    number: 0
  - name: "GetMsgSender"
    read_only: true
    inputs:
    outputs:
      - name: "sender"
        typename: "ContractAddress"
    number: 1
  - name: "GetCalldataLen"
    read_only: true
    inputs:
    outputs:
      - name: "len"
        typename: "RuntimeMemoryLength"
    number: 2
  - name: "GetCalldata"
    read_only: true
    inputs:
    outputs:
      - name: "buffer"
        span_argument: true
      - name: "written_len"
        typename: "RuntimeMemoryLength"
        primitive_type: true
    number: 3
  - name: "ConsoleLog"
    needs_context: false
    # Logging is for debugging only.
    # On release builds, this is a no-op.
    # On debug builds, this logs to console.
    read_only: true
    inputs:
      - name: "buffer"
        span_argument: true
    outputs:
    number: 4
  - name: "Invoke"
    read_only: true
    needs_gas: true
    inputs:
      - name: "address"
        typename: "ContractAddress"
      - name: "method"
        typename: "MethodID"
        primitive_type: true
      - name: "gas_limit"
        typename: "GasAmount"
        primitive_type: true
      - name: "calldata"
        span_argument: true
      - name: "flags"
        typename: "InvokeFlagSet"
        primitive_type: true
    outputs:
      - name: return_buffer_len
        typename: "RuntimeMemoryLength"
        primitive_type: true
    number: 5
  - name: "Return"
    read_only: true
    inputs:
      - name: "buffer"
        span_argument: true
      - name: "revert_frame"
        typename: "bool"
        primitive_type: true
    outputs:
    returns: false
    number: 6
  - name: "GetReturnedBuffer"
    read_only: true
    inputs:
    outputs:
      - name: "buffer"
        span_argument: true
      - name: "written_len"
        typename: "RuntimeMemoryLength"
        primitive_type: true
    number: 7
  - name: "Exit"
    read_only: true
    needs_context: false
    inputs:
    outputs:
    returns: false
    number: 8
  - name: "GetDeployAddress"
    read_only: true
    inputs:
      - name: "caller_address"
        typename: "ContractAddress"
        optional: true
      - name: "nonce"
        typename: "SHA256Hash"
      - name: "contract_hash"
        typename: "SHA256Hash"
    outputs:
      - name: "to_be_deployed"
        typename: "ContractAddress"
    number: 9
  - name: "DeployContract"
    inputs:
      - name: "nonce"
        typename: "SHA256Hash"
      - name: "contract_hash"
        typename: "SHA256Hash"
    outputs:
      - name: "deployed_address"
        typename: "ContractAddress"
    number: 10
  - name: "GetSourceTransactionHash"
    read_only: true
    inputs:
    outputs:
      - name: "source_tx_hash"
        typename: "SHA256Hash"
    number: 11
  - name: "VerifySignature"
    read_only: true
    needs_context: false
    inputs:
      - name: "scheme"
        # This is a CryptographicScheme enum, but we pass it in as an int32_t
        # to make sure the generated rust code does not assume that the enum
        # does not get extended with more signature schemes
        typename: "int32_t"
        primitive_type: true
      - name: "signature"
        span_argument: true
      - name: "public_key"
        span_argument: true
      - name: "message"
        span_argument: true
    outputs:  # No outputs: check the error code returned
    number: 12
  - name: "BytestringGetLen"
    read_only: true
    inputs:
      - name: "key"
        typename: "StorageKeyContractData"
    outputs:
      - name: "length"
        typename: "RuntimeMemoryLength"
    number: 13
  - name: "BytestringGet"
    read_only: true
    inputs:
      - name: "key"
        typename: "StorageKeyContractData"
    outputs:
      - name: "bytestring"
        span_argument: true
      - name: "written_len"
        typename: "RuntimeMemoryLength"
    number: 14
  - name: "BytestringSet"
    inputs:
      - name: "key"
        typename: "StorageKeyContractData"
      - name: "bytestring"
        span_argument: true
    outputs:
    number: 15
  - name: "NonnegativeIntGet"
    read_only: true
    inputs:
      - name: "key"
        typename: "StorageKeyContractData"
      - name: "force_load_from_snapshot"
        typename: "bool"
        primitive_type: true
    outputs:
      - name: "current_set"
        typename: "int128_t"
      - name: "current_set_opt"
        typename: "bool"
      - name: "current_add"
        typename: "int128_t"
    number: 16
  - name: "NonnegativeIntSetAdd"
    inputs:
      - name: "key"
        typename: "StorageKeyContractData"
      - name: "set_value"
        typename: "int128_t"
        syscall_pass_by_value: true
        optional: true
      - name: "add_value"
        typename: "int128_t"
        syscall_pass_by_value: true
    outputs:
    number: 17
  - name: "DeleteObject"
    inputs:
      - name: "key"
        typename: "StorageKeyContractData"
      - name: "flags"
        typename: "int32_t"  # StorageItemRPCFlagSet
        primitive_type: true
    outputs:
    number: 18
  - name: "GetCurrentAddress"
    read_only: true
    inputs:
    outputs:
      - name: "address"
        typename: "ContractAddress"
    number: 19
  - name: "RetrocausalQueueInsert"
    inputs:
      - name: "key"
        typename: "StorageKeyContractData"
      - name: "queue_entry"
        span_argument: true
    outputs:
    number: 20
  - name: "RetrocausalQueueConsume"
    inputs:
      - name: "key"
        typename: "StorageKeyContractData"
      - name: "peek"
        typename: "bool"
        primitive_type: true
    outputs:
      - name: "queue_entry"
        span_argument: true
      - name: "written_len"
        typename: "RuntimeMemoryLength"
        primitive_type: true
    number: 21
  - name: "GetTransactionStatistics"
    read_only: true
    needs_gas: true
    # Note: Some or all of these statistics
    # might be disabled during release builds
    # and/or during production execution.
    # This is allowed to return nondeterministic
    # information during test configurations
    # (and those stats will be disabled in prod)
    inputs:
      - name: "statistic"
        typename: "TransactionStatistic"
        primitive_type: true
    outputs:
      - name: "result"
        typename: "uint64_t"
    number: 22
  - name: "ChangePublicKeyRegistration"
    inputs:
      - name: "key_index"
        typename: "uint32_t"
      - name: "key_scheme"
        # This is a CryptographicScheme enum, but we pass it in as an int32_t
        # to make sure the generated rust code does not assume that the enum
        # does not get extended with more signature schemes
        typename: "int32_t"
        optional: true
      - name: "key_bytes"
        span_argument: true
      - name: "key_weight"
        typename: "uint32_t"
        optional: true
    outputs:
    number: 23
  - name: "LogEvent"
    inputs:
      - name: topic0
        typename: "SHA256Hash"
        optional: true
      - name: topic1
        typename: "SHA256Hash"
        optional: true
      - name: topic2
        typename: "SHA256Hash"
        optional: true
      - name: "data"
        span_argument: true
    outputs:
    number: 24
  - name: "GetAuthClaimCount"
    read_only: true
    inputs:
    outputs:
      - name: "count"
        typename: "uint32_t"
    number: 25
  - name: "GetAuthClaim"
    read_only: true
    inputs:
      - name: "index"
        typename: "uint32_t"
    outputs:
      - name: "auth_claim"
        typename: "generated::AuthClaim"
    number: 26
