---
type_mappings:
  - base_name: "int128_t" # The cpp name, which is used in this spec
    rust_name: "i128"
    xdr_name: "int128_xdr"
  - base_name: "uint128_t"
    rust_name: "u128"
    xdr_name: "uint128_xdr"
syscalls:
  - name: "SHA256"
    needs_context: false
    inputs:
      - name: "buffer"
        span_argument: true
    outputs:
      - name: "hash"
        typename: "SHA256Hash"
    number: 0
  - name: "GetMsgSender"
    inputs:
    outputs:
      - name: "sender"
        typename: "ContractAddress"
    number: 1
  - name: "GetCalldataLen"
    inputs:
    outputs:
      - name: "len"
        typename: "RuntimeMemoryLength"
    number: 2
  - name: "GetCalldata"
    inputs:
    outputs:
      - name: "buffer"
        span_argument: true
      - name: "written_len"
        typename: "RuntimeMemoryLength"
        primitive_type: true
    number: 3
  - name: "Log"
    inputs:
      - name: "buffer"
        span_argument: true
    outputs:
    number: 4
  - name: "Invoke"
    needs_gas: true
    inputs:
      - name: "address"
        typename: "ContractAddress"
      - name: "method"
        typename: "MethodID"
        primitive_type: true
      - name: "gas_limit"
        typename: "GasAmount"
        primitive_type: true
      - name: "calldata"
        span_argument: true
    outputs:
      - name: return_buffer_len
        typename: "RuntimeMemoryLength"
        primitive_type: true
    syscall_return_type: "HostFnResult"
    number: 5
  - name: "Return"
    inputs:
      - name: "buffer"
        span_argument: true
    outputs:
    returns: false
    number: 6
  - name: "GetReturnedBuffer"
    inputs:
    outputs:
      - name: "buffer"
        span_argument: true
      - name: "written_len"
        typename: "RuntimeMemoryLength"
        primitive_type: true
    number: 7
  - name: "Exit"
    needs_context: false
    syscall_return_type: "HostFnResult"
    inputs:
      - name: "code"
        typename: "int32_t"
        rust_typename: "i32"
        primitive_type: true
    outputs:
    returns: false
    number: 8
  - name: "GetDeployAddress"
    inputs:
      - name: "caller_address"
        typename: "ContractAddress"
        optional: true
      - name: "nonce"
        typename: "SHA256Hash"
      - name: "contract_hash"
        typename: "SHA256Hash"
    outputs:
      - name: "to_be_deployed"
        typename: "ContractAddress"
    number: 9
  - name: "DeployContract"
    inputs:
      - name: "nonce"
        typename: "SHA256Hash"
      - name: "contract_hash"
        typename: "SHA256Hash"
    outputs:
      - name: "deployed_address"
        typename: "ContractAddress"
    number: 10
  - name: "GetSourceTransactionHash"
    inputs:
    outputs:
      - name: "source_tx_hash"
        typename: "SHA256Hash"
    number: 11
  - name: "VerifySignature"
    needs_context: false
    inputs:
      - name: "signature"
        typename: "Signature"
        custom_parsing: true
        custom_args_required: 2
      - name: "public_key"
        typename: "PublicKey"
        custom_parsing: true
        custom_args_required: 2
      - name: "message"
        span_argument: true
    outputs:  # No outputs: check the error code returned
    number: 12
  - name: "BytestringGetLen"
    inputs:
      - name: "key"
        typename: "StorageKey"
    outputs:
      - name: "length"
        typename: "RuntimeMemoryLength"
    number: 13
  - name: "BytestringGet"
    inputs:
      - name: "key"
        typename: "StorageKey"
    outputs:
      - name: "bytestring"
        span_argument: true
      - name: "written_len"
        typename: "RuntimeMemoryLength"
    number: 14
  - name: "BytestringSet"
    inputs:
      - name: "key"
        typename: "StorageKey"
      - name: "bytestring"
        span_argument: true
    outputs:
    number: 15
  - name: "NonnegativeIntGet"
    inputs:
      - name: "key"
        typename: "StorageKey"
    outputs:
      - name: "current_set"
        typename: "int128_t"
        xdr_typename: "int128_xdr"
        rust_typename: "i128"
      - name: "current_add"
        typename: "int128_t"
        xdr_typename: "int128_xdr"
        rust_typename: "i128"
    number: 16
  - name: "NonnegativeIntSetAdd"
    inputs:
      - name: "key"
        typename: "StorageKey"
      - name: "set_value"
        typename: "int128_t"
        xdr_typename: "int128_xdr"
        rust_typename: "i128"
        syscall_pass_by_value: true
      - name: "add_value"
        typename: "int128_t"
        xdr_typename: "int128_xdr"
        rust_typename: "i128"
        syscall_pass_by_value: true
    outputs:
    number: 17
  - name: "DeleteObject"
    inputs:
      - name: "key"
        typename: "StorageKey"
    outputs:
    number: 18
errors:
  - name: "None"
    number: 0
    doc: "No error"
  - name: "Fault"
    number: 1
    doc: "Out of bounds pointer to wasm memory passed to syscall"
  - name: "NoSyscall"
    number: 2
    doc: "System call for supplied number is not supported"
  - name: "IsRootTransaction"
    number: 3
    doc: "Cannot call get_msg_sender on root invocation"
  - name: "ContractLookupFailed"
    number: 4
    doc: "Failed to find contract"
  - name: "ContractAlreadyDeployed"
    number: 5
    doc: "Attempt made to deploy a contract twice \
         (same nonce and contract hash, from same address)"
  - name: "NoReturnBufferAvailable"
    number: 6
    doc: "No return buffer is available.  Either the most recent subcall \
         failed, or there have been no subcalls within this call frame."
  - name: "InsufficientGasForInvocation"
    number: 7
    doc: "Insufficient gas in call frame to supply requested gas limit\
         for child invocation"
  - name: "InvalidSyscallInput"
    number: 8
    doc: "Invalid input to a syscall, such as subtracting below 0 on an nnint64"
  - name: "StorageKeyNotExist"
    number: 9
    doc: "Accessing a storage key that does not exist in the current view"
    # Used within the SDK
  - name: "CalldataParseError"
    number: 100
    doc: "Failed to parse calldata"
  - name: "ReturnParseError"
    number: 101
    doc: "Failed to parse returned data"
    # those that cause call frames to revert
  - name: "DeterministicWasm"
    number: -1
    doc: "Deterministic error within called wasm (i.e. trap)"
